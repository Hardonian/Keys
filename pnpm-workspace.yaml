# Keys Workspace Configuration
#
# src/      - Primary CLI (local-first, no backend required)
# frontend/ - Web UI (deployable to Vercel, Supabase optional)
# backend/  - Server API (optional, requires Supabase)

packages:
  - "src"
  - "frontend"
  - "backend"
allowBuilds:
  '@sentry/cli': set this to true or false
  esbuild: set this to true or false
  msw: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
minimumReleaseAgeExclude:
  - qs@6.14.2
  - minimatch@3.1.3
  - rollup@3.30.0
  - minimatch@3.1.4
  - ajv@6.14.0
  - path-to-regexp@0.1.13
  - brace-expansion@1.1.13
  - yaml@2.8.3
  - lodash@4.17.24
  - vite@7.3.2
  - follow-redirects@1.15.12
  - axios@1.15.0
  - postcss@8.5.10
  - axios@1.15.1
  - axios@1.15.2
  - fast-uri@3.1.1
  - fast-uri@3.1.2
  - next@15.5.16
  - next@15.5.18
  - ws@8.20.1
  - '@anthropic-ai/sdk@0.91.1'
  - uuid@11.1.1
  - qs@6.15.2
  - vitest@3.2.6
  - brace-expansion@5.0.6
  - lodash@4.17.23
  - shell-quote@1.8.4
  - axios@1.16.0
  - ws@8.21.0
  - ws@7.5.11
  - form-data@4.0.6
  - vite@7.3.5
  - '@babel/core@7.29.1'
  - '@opentelemetry/core@2.8.0'
  - js-yaml@4.1.2
  - esbuild@0.24.3
  - vite@6.4.2
  - esbuild@0.28.1
  - vite@6.4.3
  - sharp@0.35.0
overrides:
  '@anthropic-ai/sdk@>=0.79.0 <0.91.1': ^0.91.1
  '@opentelemetry/core@<2.8.0': ^2.8.0
  esbuild@<=0.24.2: ^0.24.3
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  postcss@<8.5.10: ^8.5.10
  qs@>=6.11.1 <=6.15.1: ^6.15.2
  rollup@>=3.0.0 <3.30.0: ^3.30.0
  sharp@<0.35.0: ^0.35.0
  uuid@<11.1.1: ^11.1.1
  vite@<=6.4.1: ^6.4.2
  vite@<=6.4.2: ^6.4.3
  vite@>=7.0.0 <=7.3.1: ^7.3.2
  vite@>=7.0.0 <=7.3.4: ^7.3.5
  vite@>=7.1.0 <=7.3.1: ^7.3.2
  vitest@<3.2.6: ^3.2.6
