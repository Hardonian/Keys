# Keys Workspace Configuration
#
# src/      - Primary CLI (local-first, no backend required)
# frontend/ - Web UI (deployable to Vercel, Supabase optional)
# backend/  - Server API (optional, requires Supabase)

packages:
  - "src"
  - "frontend"
  - "backend"
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - qs@6.14.2
  - minimatch@3.1.3
  - rollup@3.30.0
  - minimatch@3.1.4
  - ajv@6.14.0
  - path-to-regexp@0.1.13
  - brace-expansion@1.1.13
  - yaml@2.8.3
  - lodash@4.17.24
  - vite@7.3.2
  - follow-redirects@1.15.12
  - axios@1.15.0
  - postcss@8.5.10
  - axios@1.15.1
  - axios@1.15.2
  - fast-uri@3.1.1
  - fast-uri@3.1.2
  - next@15.5.16
  - next@15.5.18
  - ws@8.20.1
  - '@anthropic-ai/sdk@0.91.1'
  - uuid@11.1.1
  - qs@6.15.2
  - vitest@3.2.6
  - brace-expansion@5.0.6
  - lodash@4.17.23
  - shell-quote@1.8.4
  - axios@1.16.0
  - ws@8.21.0
  - ws@7.5.11
  - form-data@4.0.6
  - vite@7.3.5
  - '@babel/core@7.29.1'
  - '@opentelemetry/core@2.8.0'
  - js-yaml@4.1.2
  - esbuild@0.24.3
  - vite@6.4.2
  - esbuild@0.28.1
  - vite@6.4.3
  - sharp@0.35.0
overrides:
