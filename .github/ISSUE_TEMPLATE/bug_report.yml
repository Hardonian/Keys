name: Bug report
description: Report a reproducible problem in KEYS.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include as much detail as possible.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the issue and the impact.
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the minimal steps to reproduce the behavior.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add any relevant logs, errors, or screenshots.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, package manager, and relevant services.
      placeholder: "macOS 14, Node 20.11, pnpm 10.13"
    validations:
      required: true
