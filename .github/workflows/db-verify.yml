name: Database Contract Verification

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/supabase/migrations/**/*.sql'
      - 'scripts/db-verify.ts'
      - 'scripts/db-smoke.ts'

env:
  NODE_VERSION: '18'

jobs:
  verify-database-contract:
    name: Verify Database Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        # pnpm workspace (src/, frontend/, backend/) — root npm ci fails:
        # there is no root package-lock.json. Matches ci.yml.
        run: pnpm install --frozen-lockfile

      - name: Install tsx globally
        run: npm install -g tsx

      # Diagnostics only: prints length + sha256:8 fingerprint + reachability
      # class. Never prints secret values.
      - name: Preflight secrets (fingerprints only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node -e '
          const crypto = require("crypto");
          const names = ["SUPABASE_URL","NEXT_PUBLIC_SUPABASE_URL","SUPABASE_SERVICE_ROLE_KEY","NEXT_PUBLIC_SUPABASE_ANON_KEY"];
          for (const n of names) {
            const v = process.env[n] || "";
            const fp = v ? crypto.createHash("sha256").update(v).digest("hex").slice(0,8) : "unset";
            if (v.startsWith("http")) {
              let cls = "other";
              try { const h = new URL(v).hostname; cls = /^localhost$|^127\./.test(h) ? "localhost" : h; } catch {}
              console.log(`PRECHECK ${n}: len=${v.length} sha256:${fp} scheme=${v.split(":")[0]} host=${cls.split(".").slice(-2).join(".")}`);
            } else {
              console.log(`PRECHECK ${n}: len=${v.length} sha256:${fp}`);
            }
          }'
          node -e '
          const url = process.env.SUPABASE_URL || process.env.NEXT_PUBLIC_SUPABASE_URL;
          if (!url) { console.log("PRECHECK reachability: no URL set"); process.exit(0); }
          fetch(url + "/auth/v1/health", { signal: AbortSignal.timeout(8000) })
            .then(r => console.log("PRECHECK reachability: http=" + r.status))
            .catch(e => { console.log("PRECHECK reachability: FAILED " + (e.cause ? e.cause.code || e.cause.message : e.name)); });
          '

      - name: Verify database schema
        run: npm run db:verify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Run smoke tests
        run: npm run db:smoke
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-verification-report
          path: |
            .db-inventory.json
          retention-days: 30
